[project]
name = "codetrail"
version = "0.1.0"
description = "Turn a git repository into a local learning guide that keeps up with it."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pathspec==1.1.1",
    "pydantic==2.13.5",
]

[project.scripts]
codetrail = "codetrail.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]
# Hamesh's hook scripts and their tests are copied with their own compact style (AGENTS.md, writing code rule 3).
extend-exclude = [".claude", "tools", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101"] # pytest asserts

[tool.ruff.lint.isort]
known-first-party = ["codetrail", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = ["src", "."]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests", "tools/tests"]
pythonpath = ["."]
markers = [
    "slow: end-to-end tests the pre-push hook skips; CI runs them",
    "live: tests that call the real Claude; run only by `just test-live`",
]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]
