[project]
name = "codetrail"
version = "1.0.0"
description = "Turn a git repository into a local learning guide that keeps up with it."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "markdown-it-py==4.2.0",
    "pathspec==1.1.1",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "tree-sitter==0.26.0",
    "tree-sitter-hcl==1.2.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-swift==0.7.4",
    "tree-sitter-typescript==0.23.2",
    "uvicorn==0.54.0",
]

[project.scripts]
codetrail = "codetrail.cli:main"

[tool.uv]
# Rebuild an installed Codetrail whenever the checkout's commit changes, not only when pyproject.toml does,
# so `uv tool install --reinstall .` after a `git pull` installs the new code.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true } }]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]
# The hook scripts and their tests keep the compact style they were adapted in (AGENTS.md, writing code rule 3).
extend-exclude = [".claude", "tools", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101"] # pytest asserts

[tool.ruff.lint.isort]
known-first-party = ["codetrail", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607"]
# The store builds SQL from its own table and column constants only; values are always parameters.
"src/codetrail/facts/store.py" = ["S608"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = ["src", "."]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests", "tools/tests"]
pythonpath = ["."]
markers = [
    "live: tests that run the real providers installed here; run only by `just test-live`",
    "browser: tests in a real browser (Playwright, headless Chromium); run by `just test-browser`",
]
addopts = "-m 'not live and not browser'"

[dependency-groups]
dev = [
    "babel==2.18.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-playwright==0.9.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.10",
    "types-pyyaml==6.0.12.20260906",
]
