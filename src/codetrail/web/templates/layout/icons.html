{# Small inline icons drawn for Codetrail (design section 16.2). Decorative: hidden from assistive technology. #}
{% macro icon(name) -%}
<svg class="icon{% if name == "arrow" %} icon-flip{% endif %}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
{%- if name == "search" %}<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
{%- elif name == "ask" %}<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/>
{%- elif name == "home" %}<path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/>
{%- elif name == "progress" %}<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>
{%- elif name == "answer" %}<path d="M6 4h12v16l-6-4-6 4Z"/>
{%- elif name == "digest" %}<path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6"/>
{%- elif name == "decision" %}<path d="M12 3v18"/><path d="M5 7h14l-2 4H5z"/>
{%- elif name == "check" %}<path d="m5 12 4.5 4.5L19 7"/>
{%- elif name == "sun" %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif name == "menu" %}<path d="M4 7h16M4 12h16M4 17h16"/>
{%- elif name == "close" %}<path d="M6 6l12 12M18 6 6 18"/>
{%- elif name == "keyboard" %}<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>
{%- elif name == "arrow" %}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "expand" %}<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
{%- elif name == "folder" %}<path d="M3 6h7l2 2h9v11H3z"/>
{%- endif -%}
</svg>
{%- endmacro %}
