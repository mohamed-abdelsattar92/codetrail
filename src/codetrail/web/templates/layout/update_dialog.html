<dialog class="estimate-dialog" data-estimate-dialog aria-labelledby="estimate-title">
  <div class="dialog-body" data-estimate-body></div>
  <div class="dialog-actions">
    <button type="button" class="button" data-estimate-cancel>{{ _("Cancel") }}</button>
    <button type="button" class="button primary" data-estimate-go>{{ _("Go ahead") }}</button>
  </div>
</dialog>
{% from "layout/icons.html" import icon %}
<aside class="update-panel" data-update-panel aria-labelledby="update-title" hidden
       data-label-running="{{ _('Updating…') }}" data-label-done="{{ _('Updated.') }}"
       data-label-failed="{{ _('The update failed:') }}">
  <div class="ask-head">
    <h2 id="update-title">{{ _("Updating the guide") }}</h2>
    <button type="button" class="icon-button" data-update-close aria-label="{{ _('Close') }}">{{ icon("close") }}</button>
  </div>
  <ol class="update-log" data-update-log aria-live="polite"></ol>
  <p class="update-state" role="status" data-update-state></p>
</aside>
