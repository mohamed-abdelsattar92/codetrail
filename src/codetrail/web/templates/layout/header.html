{% from "layout/icons.html" import icon %}
<header class="topbar">
  <button type="button" class="icon-button menu-button" data-menu aria-controls="sidebar" aria-expanded="false" aria-label="{{ _('Menu') }}">{{ icon("menu") }}</button>
  <a class="brand" href="/"><img src="/static/brand/mark.svg" alt="" width="24" height="24"><span>codetrail</span></a>
  <span class="target" lang="en" dir="ltr">{{ target }}{% if nav.branch or nav.commit %}<span class="target-meta">{{ nav.branch }}{% if nav.commit %} · {{ nav.commit[:7] }}{% endif %}</span>{% endif %}</span>
  <div class="topbar-search">
    <form class="search-box" action="/search" method="get" role="search" data-search-form>
      {{ icon("search") }}
      <input type="search" name="q" placeholder="{{ _('Search or ask…') }}" aria-label="{{ _('Search the guide') }}" autocomplete="off" maxlength="1000">
      <kbd class="search-hint" aria-hidden="true">⌘K</kbd>
    </form>
  </div>
  <div class="topbar-actions">
    <button type="button" class="button" data-ask-open>{{ icon("ask") }}<span>{{ _("Ask") }}</span></button>
    <button type="button" class="icon-button" data-theme-toggle
            data-label-system="{{ _('Theme: system (switch to light)') }}"
            data-label-light="{{ _('Theme: light (switch to dark)') }}"
            data-label-dark="{{ _('Theme: dark (switch to system)') }}"
            aria-label="{{ _('Switch theme') }}">{{ icon("sun") }}</button>
    <form class="language" data-language-form>
      <label><span class="visually-hidden">{{ _("Language") }}</span>
        <select name="language">
          {% for option in languages %}<option value="{{ option.code }}" {% if option.code == language.code %}selected{% endif %}>{{ option.name }}</option>{% endfor %}
        </select>
      </label>
    </form>
    <button type="button" class="icon-button" data-shortcuts-open aria-label="{{ _('Keyboard shortcuts') }}">{{ icon("keyboard") }}</button>
  </div>
</header>
