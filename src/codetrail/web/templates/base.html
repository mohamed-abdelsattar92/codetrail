<!doctype html>
<html lang="{{ language.code }}" dir="{{ language.direction }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="codetrail-token" content="{{ token }}">
  <title>{% block title %}{{ target }}{% endblock %} · Codetrail</title>
  <link rel="stylesheet" href="/static/page.css">
  <script src="/static/vendor/mermaid.js" defer></script>
  <script src="/static/page.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Codetrail · <span lang="en" dir="ltr">{{ target }}</span></a>
    <nav>
      <a href="/">{{ _("Home") }}</a>
      <a href="/decisions">{{ _("Decisions") }}</a>
    </nav>
    <form class="language" data-language-form>
      <label>{{ _("Language") }}
        <select name="language">
          {% for option in languages %}
          <option value="{{ option.code }}" {% if option.code == language.code %}selected{% endif %}>{{ option.name }}</option>
          {% endfor %}
        </select>
      </label>
    </form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <section class="ask" data-ask {% if page is defined and page.id %}data-page-id="{{ page.id }}"{% endif %}>
    <h2>{{ _("Ask Claude about the code") }}</h2>
    <form data-ask-form>
      <textarea name="question" rows="3" maxlength="4000" required placeholder="{{ _('For example: how does a request reach the database?') }}"></textarea>
      <button type="submit">{{ _("Ask") }}</button>
    </form>
    <p class="muted" data-ask-status></p>
    <div class="answer" data-answer lang="{{ language.code }}" dir="auto"></div>
    <button type="button" data-save-answer hidden>{{ _("Save to guide") }}</button>
  </section>
</body>
</html>
